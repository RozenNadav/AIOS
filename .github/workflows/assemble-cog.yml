name: assemble-cog
on:
  workflow_dispatch:
  push:
    paths:
      - 'kernel/src/.cog.b64.*'
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble cog.rs
        run: |
          set -euo pipefail
          if [ -f kernel/src/.cog.b64.07a ]; then
            cat kernel/src/.cog.b64.00 kernel/src/.cog.b64.01 kernel/src/.cog.b64.02 \
                kernel/src/.cog.b64.03 kernel/src/.cog.b64.04 kernel/src/.cog.b64.05 \
                kernel/src/.cog.b64.06 kernel/src/.cog.b64.07a kernel/src/.cog.b64.07b \
                kernel/src/.cog.b64.08 | tr -d '\n' | base64 -d > kernel/src/cog.rs
          else
            cat kernel/src/.cog.b64.00 kernel/src/.cog.b64.01 kernel/src/.cog.b64.02 \
                kernel/src/.cog.b64.03 kernel/src/.cog.b64.04 kernel/src/.cog.b64.05 \
                kernel/src/.cog.b64.06 kernel/src/.cog.b64.07 \
                kernel/src/.cog.b64.08 | tr -d '\n' | base64 -d > kernel/src/cog.rs
          fi
          SIZE=$(wc -c < kernel/src/cog.rs)
          HASH=$(sha256sum kernel/src/cog.rs | awk '{print $1}')
          echo "size=$SIZE hash=$HASH"
          test "$SIZE" -eq 51642
          test "$HASH" = "b1cc84f87987fde79629c454d91a4855796e53d371276e0e659a343424606e1a"
          rm -f kernel/src/.cog.b64.* kernel/src/.cog.part* kernel/src/_size_probe*.rs kernel/src/.cog.half*
          rm -f .github/workflows/assemble-cog.yml
          git config user.name "aios-bot"
          git config user.email "aios-bot@users.noreply.github.com"
          git add -A
          git commit -m "Assemble kernel/src/cog.rs from base64 parts" || exit 0
          git push
